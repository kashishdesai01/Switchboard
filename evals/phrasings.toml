stage = "intent"
say = "I want to book a checkup for myself."
reading = { action = "book", patient = "self" }
expect = "advance"
to = "name"
reply_lacks = "for you or for someone else"
must_pass = true
note = "The caller already said who the patient is; asking again is the reported 'doesn't understand context' failure."

[[cases]]
id = "intent-for-me-with-provider"
stage = "intent"
say = "I need an appointment for me with Dr. Chen next week."
reading = { action = "book", patient = "self", value_contains = "Chen" }
