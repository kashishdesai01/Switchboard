[[cases]]
id = "intent-long-opener-keeps-provider"
stage = "intent"
turns = [
    { say = "I want to schedule an appointment for my uncle, he had a stroke a few months ago and was seen by Doctor Chen, and he's been doing physical therapy since.", reading = { action = "book" } },
    { say = "Yes.", reading = { action = "affirm" } },
]
expect = "advance"
to = "name"
