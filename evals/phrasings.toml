# Caller replies in their own words, the reading a correct model gives them, and
# what the call should then do. Loaded by evals/phrasings.py; used by
# tests/test_phrasings.py (fake model returns `reading`) and evals/run_phrasings.py
# (real model must produce `reading`).
#
# [setups.<name>]  caller turns, answered without a model, that bring a fresh call
#                  (Bayview demo clinic, front desk on) to `stage`. `question` is a
#                  part of the assistant's last reply: the question the case answers.
#
# [[cases]]
#   id          unique, lowercase with dashes
#   stage       the stage the caller is answering
#   setup       setup name (defaults to the stage name)
#   say         the caller's reply ...
#   reading     ... and its expected reading: action (or a list of equally correct
#               actions), optional value (compared loosely; "<reply>" means the exact
#               reply; dates compare as dates) or value_contains, emergency (default
#               false), optional needs_staff, optional answer: the answer to the
#               question just asked (yes / no / unclear / not_applicable, or a list).
#               On confirmation stages it defaults to what the action implies
#               (affirm: yes, decline: no, unclear: unclear); the eval scores it.
#   live_reading  optional: the wrong reading a real model gave on a reported live
#               call. Only the fake harness uses it; the code must still cope.
#   turns       instead of say/reading, a list of { say, reading, live_reading } for
#               replies split over several turns.
#   expect      advance (to = stage) | reask (stays on the stage, no outcome) |
#               decline | handoff | booked | goodbye | info | no_write (no outcome)
#   reply_has / reply_lacks / state   optional extra checks after the last turn;
#               state compares str(call.<dotted attribute>).
#   must_pass   true for clear cases, hedges that must stay unclear, and the reported
#               failures; false for honestly ambiguous ones.
#   reported    number of the reported live-call failure (CHECKLIST.md).
#   xfail       why the code mishandles the case today (fake harness only).

[setups.intent]
stage = "intent"
question = "How can I help today?"
turns = []

[setups.booking_recipient]
stage = "booking_recipient"
question = "Is the appointment for you or for someone else?"
turns = ["book a follow-up"]

[setups.proxy_permission]
stage = "proxy_permission"
question = "Do you have permission to book a visit for this patient?"
turns = ["book a follow-up", "someone else"]

[setups.proxy_permission_cancel]
stage = "proxy_permission"
question = "Do you have permission to cancel this patient's appointment?"
turns = ["I need to cancel the appointment for my mom"]
existing = 1

[setups.name]
stage = "name"
question = "What name should I use?"
turns = ["book a follow-up", "For me."]

[setups.name_patient]
stage = "name"
question = "What's the patient's full name?"
turns = ["book a follow-up", "someone else", "yes"]

[setups.check_name]
stage = "check_name"
question = "I heard the patient's name as John Smith. Is that correct?"
turns = ["book a follow-up", "it's for John Smith", "yes"]

[setups.dob]
stage = "dob"
question = "What's your date of birth?"
turns = ["book a follow-up", "For me.", "Maria Lopez"]

[setups.check_dob]
stage = "check_dob"
question = "I heard Maria Lopez, born July 2, 1984. Is that correct?"
turns = ["book a follow-up", "For me.", "Maria Lopez", "July 2 1984"]

[setups.other_provider]
stage = "other_provider"
question = "Would you like to hear times with another doctor here?"
turns = ["I'd like to book a follow-up with Dr. Smith", "For me."]

[setups.day_alternative]
stage = "day_alternative"
question = "I don't have an opening today. Would you like the next available day?"
turns = ["book a follow-up today after 4:50 pm", "For me.", "Maria Lopez", "July 2 1984", "yes"]

[setups.select_slot]
stage = "select_slot"
question = "Which time works for you? Option 1: Tuesday, November 10 at 09:25 AM"
turns = ["book a follow-up", "For me.", "Maria Lopez", "July 2 1984", "yes"]

[setups.confirm_change]
stage = "confirm_change"
question = "Book your follow-up on Tuesday, November 10 at 09:25 AM"
turns = ["book a follow-up", "For me.", "Maria Lopez", "July 2 1984", "yes", "one"]

[setups.email_readback]
stage = "email_readback"
question = "I heard maria at example dot com. Is that the right email address?"
turns = [
    "book a follow-up", "For me.", "Maria Lopez", "July 2 1984", "yes", "one",
    "change my email", "maria at example dot com",
]

[setups.anything_else]
stage = "anything_else"
question = "Is there anything else I can help with?"
turns = ["what are your hours?"]

# ---------------------------------------------------------------- intent (opener)

[[cases]]
id = "intent-book-follow-up"
stage = "intent"
say = "I'd like to book a follow-up."
reading = { action = "book" }
expect = "advance"
to = "booking_recipient"
must_pass = true

